<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeepSeek Harness</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #101014; color: #e8e8ec;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .box { text-align: center; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 24px;
    border-radius: 16px;
    background: linear-gradient(135deg, #4D6BFE 0%, #1e2f8f 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 22px; letter-spacing: 0.5px;
  }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: #4D6BFE;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12px; color: #8a8a94; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">dsh</div>
    <div class="spinner"></div>
    <div class="title">正在启动 DeepSeek Harness…</div>
    <div class="hint">本地服务运行于 http://127.0.0.1:3080</div>
  </div>
</body>
</html>
